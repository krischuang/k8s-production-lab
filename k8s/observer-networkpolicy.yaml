# demo-observer pods are still subject to k8s/networkpolicy.yaml's
# default-deny-all (podSelector: {} matches every pod in inventory-prod,
# including this one) and already get DNS egress from that file's
# allow-dns-egress rule. This file adds exactly one more egress path the
# observer needs -- the ingress-nginx controller, to proxy the "Send Request"
# demo through the same path real traffic takes.
#
# The Kubernetes API server egress rule is applied separately by
# scripts/deploy.sh, not committed here as static YAML. Reasoning: the
# textbook approach is an ipBlock on the "kubernetes" Service's ClusterIP
# (10.96.0.1/32) -- but on this cluster, verified empirically, Calico
# evaluates pod egress policy against the *post-DNAT* destination for the
# host-networked apiserver static pod (its real node IP:6443), not the
# ClusterIP the pod dialed. An ipBlock on the ClusterIP silently matches
# nothing and the connection times out; a wide-open ipBlock is needed, scoped
# to the specific node IP kube-proxy is actually routing to, which changes
# across cluster recreations (kind assigns it from Docker's bridge network).
# So scripts/deploy.sh resolves the real address from
# `kubectl get endpoints kubernetes -n default` at deploy time and generates
# the policy from that -- still least-privilege (one IP, one port), just not
# a static value that survives being written down once.
#
# Deliberately absent: any ingress rule for demo-observer. The dashboard is
# reached via `kubectl port-forward` for this local demo (see
# scripts/dashboard.sh), which talks to the kubelet directly and isn't
# subject to pod-to-pod NetworkPolicy -- so no inbound hole needs to be
# punched in default-deny-all just to serve the dashboard.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-observer-egress-to-ingress
  namespace: inventory-prod
spec:
  podSelector:
    matchLabels:
      app: demo-observer
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80
