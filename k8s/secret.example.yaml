# Template for the credentials the API and Postgres both consume.
#
# This file is safe to commit: every value below is a placeholder. Real
# secrets are never checked in (see .gitignore, which ignores k8s/secret.yaml).
#
# Local workflow:
#   cp k8s/secret.example.yaml k8s/secret.yaml
#   # edit k8s/secret.yaml with real values
#   kubectl apply -f k8s/secret.yaml
#
# In an actual production cluster this would instead come from a secrets
# manager (Vault, AWS Secrets Manager, Sealed Secrets, External Secrets
# Operator, etc.) synced into the cluster rather than applied from a
# plaintext file at all.
apiVersion: v1
kind: Secret
metadata:
  name: inventory-db-credentials
  namespace: inventory-prod
type: Opaque
stringData:
  POSTGRES_USER: "appuser"
  POSTGRES_PASSWORD: "change-me-before-deploying"
  DATABASE_URL: "postgresql://appuser:change-me-before-deploying@postgres.inventory-prod.svc.cluster.local:5432/inventory"
