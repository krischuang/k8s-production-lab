# Minimal in-cluster Postgres for local demos. Single replica with an
# emptyDir volume: data does not survive pod rescheduling. A real environment
# would use a managed database (RDS, Cloud SQL) or a StatefulSet backed by a
# PersistentVolumeClaim with a real storage class. See README "Production
# limitations" for the full list of shortcuts taken here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: inventory-prod
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # fsGroup makes the emptyDir volume group-writable by UID 999 (the
      # official postgres:16-alpine image's built-in "postgres" user) so the
      # container can run as non-root from the start instead of relying on
      # the image's own entrypoint to chown the data directory as root first.
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # readOnlyRootFilesystem is deliberately NOT set here. The
          # official postgres image writes to /var/run/postgresql (unix
          # socket) and /tmp in addition to the already-separate /var/lib/
          # postgresql/data volume; doing this correctly needs extra
          # emptyDir mounts for those paths plus verification against a
          # live cluster (no cluster was available when this fix was
          # written -- see docs/threat-model.md T13 residual risk).
          # Claiming readOnlyRootFilesystem here without that verification
          # would be an unverified security claim.
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: inventory-db-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inventory-db-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: inventory-api-config
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "appuser", "-d", "inventory"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "appuser", "-d", "inventory"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: pgdata
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: inventory-prod
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
