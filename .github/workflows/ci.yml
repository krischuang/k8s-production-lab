name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: application tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements-dev.txt
      - run: python -m pytest app/tests -v

  test-observer:
    name: observer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r observer/requirements-dev.txt
      - run: python -m pytest observer/tests -v

  validate-manifests:
    name: validate kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: yamllint
        run: |
          pip install yamllint
          yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable, truthy: {allowed-values: ['true','false']}}}" k8s/ infra/

      - name: install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: kubeconform schema validation
        run: |
          kubeconform -strict -summary \
            -ignore-filename-pattern 'secret\.example\.yaml' \
            k8s/*.yaml
          # kubeconform checks every manifest against the upstream Kubernetes
          # OpenAPI schemas without needing a live cluster. A real
          # kubectl --dry-run=server pass happens as part of scripts/deploy.sh
          # against the local kind cluster (see README "CI").

  build:
    name: build docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build inventory-api image
        run: docker build -f app/Dockerfile -t inventory-api:ci .
      - name: build demo-observer image
        run: docker build -f observer/Dockerfile -t demo-observer:ci .

  security-tests:
    name: automated negative security tests (static, no cluster)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements-dev.txt
      - name: run static RBAC/NetworkPolicy security tests
        run: python -m pytest tests/security -m "not integration" -v
        # Live tests (test_rbac_live.py, test_networkpolicy_live.py) require
        # a real kind cluster and are intentionally not run in CI -- same
        # reasoning as validate-manifests already documents for
        # kubectl --dry-run=server. Run them locally after
        # scripts/setup-cluster.sh + scripts/deploy.sh.

  security-scan:
    name: IaC and dependency security scanning
    runs-on: ubuntu-latest
    env:
      # aquasecurity/trivy-action's bundled installer unconditionally
      # downloads the trivy binary from get.trivy.dev, which has an
      # unrelated DNS outage as of 2026-11-04 (NXDOMAIN, independent of
      # GitHub). Run trivy via its official container image instead --
      # pulled from ghcr.io, same place the action fetches its vulnerability
      # DB from -- so the scan doesn't depend on that domain at all.
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e # 0.70.0
      # trivy-action cached the vulnerability DB across runs (key:
      # cache-trivy-<date>, default cache-dir under $GITHUB_WORKSPACE).
      # Reproduce that here so dependency scans don't re-download the ~130MB
      # DB on every run, and so all 3 steps in this job share one download.
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.trivy-cache
    steps:
      - uses: actions/checkout@v4

      - name: get current date (for trivy DB cache key)
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: restore trivy vulnerability DB cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TRIVY_CACHE_DIR }}
          key: cache-trivy-${{ steps.date.outputs.date }}
          restore-keys: cache-trivy-

      - name: trivy config scan (k8s manifests + Dockerfiles)
        run: |
          mkdir -p "$TRIVY_CACHE_DIR"
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -v "$TRIVY_CACHE_DIR:/root/.cache/trivy" \
            "$TRIVY_IMAGE" \
            config . \
            --severity MEDIUM,HIGH,CRITICAL \
            --exit-code 1 \
            --ignorefile .trivyignore

      - name: trivy dependency scan (app)
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -v "$TRIVY_CACHE_DIR:/root/.cache/trivy" \
            "$TRIVY_IMAGE" \
            fs app/requirements.txt \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1

      - name: trivy dependency scan (observer)
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -v "$TRIVY_CACHE_DIR:/root/.cache/trivy" \
            "$TRIVY_IMAGE" \
            fs observer/requirements.txt \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1
        # Image-layer scanning (the built inventory-api:ci / demo-observer:ci
        # images from the `build` job above) is a documented follow-up, not
        # done here -- see docs/owasp-security-review.md "Supply chain /
        # image provenance".
